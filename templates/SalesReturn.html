<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Billing Page</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/SalesReturn.css">
</head>
<body>
<div class="billing-container">
    <header>Create Sales Return Invoice</header>

    <!-- Invoice Number -->
    <label for="invoiceNumber">Sales Invoice Number: <span style="color: red;">*</span></label><br>
    <input type="text" id="invoiceNumber" name="invoiceNumber" placeholder="Enter Invoice Number"
           style="width: 300px;" onkeyup="searchInvoiceNumber()" >
    <div id="invoiceNumberSuggestions" class="suggestions">
    </div>
    <p>
        <strong>Customer Name:</strong>
        <span id="customerName" ></span>
    </p>




    <!-- Billing Table -->
    <table id="billingTable">
        <thead>
        <tr>
            <th>Product Code</th>
            <th>Product Name</th>
            <th>Ordered Quantity</th>
            <th>Return Quantity</th>
            <th>Price per Unit</th>
            <th>Total</th>
        </tr>
        </thead>
        <tbody>
        <tr id="templateRow" style="display:none;">
            <input type="hidden" name="productId[]">
            <td><input type="text" name="itemCode[]" placeholder="Code" readonly></td>
            <td><input type="text" name="itemName[]" placeholder="Product name" readonly></td>
            <td><input type="number"  name="quantity[]" readonly></td>
            <td><input type="number" min="1" step="any" name="returnQuantity[]" placeholder="0" onkeypress="if (['-','e','E'].includes(event.key)) event.preventDefault();" required></td>
            <td><input type="number" name="pricePerUnit[]"  readonly></td>
            <td><input type="text" name="total[]" placeholder="0.00" readonly></td>
        </tr>
        </tbody>
    </table>

</div>

<div id="totals">
    <p>Subtotal   : ₹<span id="subtotal">0.00</span></p>
    <p>GST (10%)  : ₹<span id="gst">0.00</span></p>
    <p>Grand Total: ₹<span id="grandTotal">0.00</span></p>
    <button type="button" id="generateBtn" onclick="createSalesReturn()" >Create Return</button>
</div>

<button class="back-button" onclick="window.location.href='/home'">Back</button>

<script th:src="@{/js/salesReturn.js}" defer></script>
<script src="/js/common.js"></script>
</body>
</html>
