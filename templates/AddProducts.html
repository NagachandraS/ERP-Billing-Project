<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product – Industrial Oil</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/AddProducts.css">
</head>
<body>

<header>Add New Product</header>

<form th:action="@{/products/save}" th:object="${products}" method="post">
    <!-- Product Name -->
    <label for="name">Product Name:</label>
    <input type="text" id="name" th:field="*{productName}" placeholder="e.g. Industrial Lubricant" required />

    <label for="name">Barcode:</label>
    <input type="text" id="barCode" th:field="*{barCode}" placeholder="e.g. 44554553432" required />

    <label for="name">Product Code:</label>
    <input type="text" id="productCode" th:field="*{productCode}" placeholder="e.g. 000001" required />

     <label>Volume per Bottle (ml):</label>
      <input type="number" th:field="*{MlUnits}" placeholder="e.g. 650" required />

      <!-- Case Configuration -->
    <select name="caseId" required>
        <option value="">-- Select Case --</option>
        <option th:each="c : ${listOfCases}"
                th:value="${c.packingId}"
                th:text="${c.packageName}">
        </option>
    </select>

    <!-- Opening Stock -->
    <label>Opening Stock (in Bottles):</label>
    <input type="number" th:field="*{productQuantity}" min="0" required />
    <!-- Quantity -->

    <!-- Price -->
    <label for="price">Price per Unit (₹):</label>
    <input type="number" id="price" th:field="*{productPrice}" step="0.01" min="0" required />

    <!-- Category -->
    <label>Category:</label>
    <select th:field="*{productCategoryType}" required>
        <option value="">-- Select Category --</option>
        <option value="BEER">Beer</option>
        <option value="WINE">Wine</option>
        <option value="RUM">Rum</option>
        <option value="WHISKY">Whisky</option>
        <option value="VODKA">Vodka</option>
        <option value="BRANDY">Brandy</option>

    </select>
    <!-- Description -->
    <label for="description">Description:</label>
    <textarea id="description" th:field="*{productDescription}" rows="3" placeholder="Short product description"></textarea>

    <!-- Buttons -->
    <div class="button-group">
        <button type="button" onclick="window.location.href='/home'">Back</button>
        <button type="submit">Save Product</button>
    </div>
</form>
<script src="/js/common.js"></script>
</body>

</html>
