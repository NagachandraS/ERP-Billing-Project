<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/AddVendor.css">
</head>
<body>

<header>Add Vendor</header>

<form th:action="@{/vendor/save}" th:object="${vendors}" method="post">

    <label for="name">Name</label>
    <input id="name" type="text" th:field="*{vendorName}" required />

    <label for="phone">Phone Number</label>
    <input id="phone" type="text" th:field="*{vendorPhoneNumber}" required />

    <label for="address">Address</label>
    <input id="address" type="text" th:field="*{vendorAddress}" required />

    <label for="email">Email</label>
    <input id="email" type="email" th:field="*{vendorEmail}" required />

    <button onclick="window.location.href='/home'" type="button">Back</button>
    <button type="submit" onclick="window.location.href='/home'">Save Vendor</button>
</form>
<script src="/js/common.js"></script>
</body>
</html>
