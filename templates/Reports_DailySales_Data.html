<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Report</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/Reports.css">

</head>

<body>

<header>
    Daily Sales Report
</header>

<div class="report-container">

    <h2 class="report-title">Daily Sales Summary</h2>

    <div class="report-date">
        Report Date:
        <span th:text="${selectedDate}"></span>
    </div>

    <div class="report-cards">

        <div class="report-card">
            <div class="card-title">Bottles Sold</div>
            <div class="card-value"
                 th:text="${report.numberOfBottles}">
            </div>
        </div>

        <div class="report-card">
            <div class="card-title">Litres Sold</div>
            <div class="card-value"
                 th:text="${report.litres}">
            </div>
        </div>

        <div class="report-card">
            <div class="card-title">Grand Total</div>
            <div class="card-value"
                 th:text="'₹ ' + ${report.grandTotal}">
            </div>
        </div>

    </div>

    <div class="button-group">

        <button class="back-button"
                onclick="history.back()">
            Back
        </button>

        <button class="back-button"
                onclick="window.print()">
            Print
        </button>

    </div>

</div>

</body>
</html>
