<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Wise Sales Report</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/Reports.css">

</head>

<body>

<header>
    Product Wise Sales Report
</header>

<div class="report-container">

    <h2 class="report-title">Stock Movement report</h2>

    <div id="fromDate" class="report-date">
        From Date:
        <span th:text="${fromDate}"></span>
    </div>
    <div id="toDate" class="report-date">
        To Date:
        <span th:text="${toDate}"></span>
    </div>

    <!-- Summary Cards -->
    <!-- Product Details -->

    <table class="report-table">

        <thead>
        <tr>
            <th>Date</th>
            <th>Product Name</th>
            <th>Opening Stock</th>
            <th>Quantity</th>
            <th>Movement Type</th>
            <th>Closing Stock</th>
            <th>Reference Number</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="row : ${report}">
        <td th:text="${row.date}"></td>
        <td th:text="${row.itemName}"></td>
        <td th:text="${row.openingStock}"></td>
         <td th:text="${row.movementType == 'IN'}
             ? '+' + ${row.quantity}
             : '-' + ${row.quantity}">
         </td>
            <td th:text="${row.movementType}"></td>

        <td th:text="${row.closingStock}"></td>
        <td th:text="${row.referenceNumber}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(report)}">
            <td colspan="4">No records found</td>
        </tr>

        </tbody>

    </table>

    <div class="button-group">

        <button class="back-button"
                onclick="history.back()">
            Back
        </button>

        <button class="back-button"
                onclick="window.print()">
            Print
        </button>

    </div>

</div>

</body>
</html>
